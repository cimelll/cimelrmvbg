<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cimel Remove BG</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#05070a;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  width:min(680px,100%);
  margin:auto;
  padding:35px 16px;
}

header{text-align:center;margin-bottom:30px}

.logo{
  font-size:27px;
  font-weight:800;
}

.logo span{color:#168cff}

.sub{
  color:#788797;
  font-size:13px;
  margin-top:8px;
}

.box{
  background:#0c1016;
  border:1px solid #1b2530;
  border-radius:20px;
  padding:25px;
}

.upload{
  display:block;
  border:1px dashed #315d86;
  border-radius:15px;
  padding:45px 15px;
  text-align:center;
  cursor:pointer;
}

.upload-icon{
  font-size:35px;
  color:#168cff;
  margin-bottom:15px;
}

.upload h2{
  font-size:21px;
  margin:0 0 8px;
}

.upload p{
  color:#718092;
  font-size:13px;
  margin:0 0 20px;
}

.choose{
  display:inline-block;
  background:#168cff;
  padding:13px 23px;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
}

input{display:none}

.preview{
  display:none;
  margin-top:20px;
  text-align:center;
}

.preview img{
  max-width:100%;
  max-height:400px;
  border-radius:12px;
}

.process{
  display:none;
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#168cff;
  color:#fff;
  font-weight:bold;
}

.status{
  text-align:center;
  color:#7b8a9a;
  font-size:12px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="logo">Cimel<span>.</span>Remove BG</div>
  <div class="sub">hapus background foto secara gratis</div>
</header>

<div class="box">

<label class="upload" for="imageInput">

  <div class="upload-icon">✦</div>

  <h2>hapus background foto</h2>

  <p>pilih foto dari galeri kamu</p>

  <span class="choose">PILIH FOTO</span>

</label>

<input
  id="imageInput"
  type="file"
  accept="image/*"
>

<div class="preview" id="preview">
  <img id="previewImage">
</div>

<button
  class="process"
  id="processButton"
  type="button"
>
  HAPUS BACKGROUND
</button>

<div class="status" id="status"></div>

</div>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");
const processButton = document.getElementById("processButton");
const status = document.getElementById("status");

imageInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  const imageURL = URL.createObjectURL(file);

  previewImage.src = imageURL;

  preview.style.display = "block";
  processButton.style.display = "block";

  status.textContent = "foto berhasil dipilih.";

});

processButton.addEventListener("click", function(){

  status.textContent = "foto siap diproses.";

});

</script>

</body>
</html>
