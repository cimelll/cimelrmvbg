<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cimel Remove BG</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f7, #f4eaff);
      color: #29202b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 600px;
      background: rgba(255,255,255,.94);
      border-radius: 28px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(150,80,150,.15);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .pink {
      color: #e94f9b;
    }

    .sub {
      color: #777;
      margin: 10px 0 25px;
    }

    .upload {
      display: block;
      border: 2px dashed #e58abb;
      border-radius: 22px;
      padding: 40px 20px;
      cursor: pointer;
      background: #fff8fc;
      transition: .2s;
    }

    .upload:hover {
      background: #fff1f8;
      transform: scale(1.01);
    }

    .icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .upload-title {
      font-size: 18px;
      font-weight: bold;
    }

    .upload-text {
      color: #999;
      margin-top: 8px;
      font-size: 14px;
    }

    #fileInput {
      display: none;
    }

    button,
    .download {
      border: 0;
      border-radius: 14px;
      padding: 13px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
      color: white;
    }

    #removeBtn {
      background: #e94f9b;
    }

    #removeBtn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #preview,
    #result {
      max-width: 100%;
      max-height: 400px;
      margin: 20px auto 0;
      border-radius: 18px;
      display: none;
    }

    #status {
      margin-top: 18px;
      min-height: 24px;
      color: #777;
      font-size: 14px;
    }

    .result-title {
      display: none;
      margin-top: 25px;
      font-weight: bold;
    }

    .download {
      display: none;
      background: #7b4de8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>
      cimel <span class="pink">remove bg</span> ✨
    </h1>

    <p class="sub">
      hapus background foto dengan gampang
    </p>

    <label class="upload" for="fileInput">
      <div class="icon">🖼️</div>

      <div class="upload-title">
        pilih foto
      </div>

      <div class="upload-text">
        klik di sini untuk upload gambar
      </div>
    </label>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
    >

    <img id="preview" alt="preview">

    <button id="removeBtn" disabled>
      ✨ hapus background
    </button>

    <div id="status"></div>

    <div id="resultTitle" class="result-title">
      hasil foto kamu ✨
    </div>

    <img id="result" alt="hasil">

    <br>

    <a
      id="downloadBtn"
      class="download"
      download="cimel-remove-bg.png"
    >
      ⬇️ download hasil
    </a>

  </div>

<script>
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  const result = document.getElementById("result");
  const removeBtn = document.getElementById("removeBtn");
  const status = document.getElementById("status");
  const downloadBtn = document.getElementById("downloadBtn");
  const resultTitle = document.getElementById("resultTitle");

  let selectedFile = null;
  let resultUrl = null;

  fileInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
      return;
    }

    if (!file.type.startsWith("image/")) {
      status.textContent = "file harus berupa gambar";
      return;
    }

    selectedFile = file;

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

    result.style.display = "none";
    resultTitle.style.display = "none";
    downloadBtn.style.display = "none";

    status.textContent = "foto siap diproses ✨";
    removeBtn.disabled = false;
  });


  removeBtn.addEventListener("click", async function () {

    if (!selectedFile) {
      return;
    }

    removeBtn.disabled = true;
    status.textContent = "lagi menghapus background... ⏳";

    const formData = new FormData();

    formData.append("image", selectedFile);


    try {

      const response = await fetch("/api/remove-bg", {
        method: "POST",
        body: formData
      });


      if (!response.ok) {

        let errorMessage = "gagal memproses foto";

        try {

          const data = await response.json();

          if (data.error) {
            errorMessage = data.error;
          }

          if (data.detail) {
            console.error(data.detail);
          }

        } catch (e) {}

        throw new Error(errorMessage);
      }


      const blob = await response.blob();

      if (!blob || blob.size === 0) {
        throw new Error("hasil foto kosong");
      }


      if (resultUrl) {
        URL.revokeObjectURL(resultUrl);
      }

      resultUrl = URL.createObjectURL(blob);

      result.src = resultUrl;

      result.style.display = "block";
      resultTitle.style.display = "block";

      downloadBtn.href = resultUrl;
      downloadBtn.style.display = "inline-block";

      status.textContent =
        "berhasil! background sudah dihapus ✨";

    } catch (error) {

      console.error(error);

      status.textContent =
        "gagal: " + error.message;

    } finally {

      removeBtn.disabled = false;

    }

  });
</script>

</body>
</html>
