<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cimel Remove BG</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f7, #f4eaff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #29202b;
    }

    .box {
      width: 100%;
      max-width: 600px;
      background: rgba(255,255,255,.9);
      border-radius: 28px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(150,80,150,.15);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .pink {
      color: #e94f9b;
    }

    .sub {
      color: #777;
      margin: 10px 0 25px;
    }

    .upload {
      border: 2px dashed #e58abb;
      border-radius: 22px;
      padding: 40px 20px;
      cursor: pointer;
      background: #fff8fc;
      transition: .2s;
    }

    .upload:hover {
      transform: scale(1.01);
      background: #fff1f8;
    }

    .icon {
      font-size: 50px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 13px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
      background: #e94f9b;
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #fileInput {
      display: none;
    }

    #preview,
    #result {
      max-width: 100%;
      max-height: 400px;
      margin: 20px auto 0;
      border-radius: 18px;
      display: none;
    }

    #status {
      margin-top: 18px;
      color: #777;
      min-height: 22px;
    }

    .download {
      display: none;
      background: #7b4de8;
      text-decoration: none;
      color: white;
      padding: 13px 22px;
      border-radius: 14px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>cimel <span class="pink">remove bg</span> ✨</h1>
    <p class="sub">hapus background foto dengan gampang</p>

    <label class="upload" for="fileInput">
      <div class="icon">🖼️</div>
      <b>pilih foto</b>
      <div style="color:#999;margin-top:8px">
        klik di sini untuk upload gambar
      </div>
    </label>

    <input id="fileInput" type="file" accept="image/*">

    <img id="preview">

    <br>

    <button id="removeBtn" disabled>
      ✨ hapus background
    </button>

    <div id="status"></div>

    <img id="result">

    <br>

    <a id="downloadBtn" class="download" download="cimel-remove-bg.png">
      ⬇️ download hasil
    </a>
  </div>

<script>
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  const result = document.getElementById("result");
  const removeBtn = document.getElementById("removeBtn");
  const status = document.getElementById("status");
  const downloadBtn = document.getElementById("downloadBtn");

  let selectedFile = null;

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];

    if (!file) return;

    selectedFile = file;

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

    result.style.display = "none";
    downloadBtn.style.display = "none";

    removeBtn.disabled = false;
    status.textContent = "foto siap diproses ✨";
  });

  removeBtn.addEventListener("click", async () => {
    if (!selectedFile) return;

    removeBtn.disabled = true;
    status.textContent = "lagi menghapus background... ⏳";

    const formData = new FormData();
    formData.append("image", selectedFile);

    try {
      const response = await fetch("/api/remove-bg", {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        let message = "gagal memproses foto";

        try {
          const data = await response.json();
          if (data.error) message = data.error;
        } catch {}

        throw new Error(message);
      }

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);

      result.src = url;
      result.style.display = "block";

      downloadBtn.href = url;
      downloadBtn.style.display = "inline-block";

      status.textContent = "berhasil! background sudah dihapus ✨";
    } catch (error) {
      status.textContent = "gagal: " + error.message;
    }

    removeBtn.disabled = false;
  });
</script>

</body>
</html>
