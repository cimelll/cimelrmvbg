<script type="module">

import removeBackground from "https://esm.sh/@imgly/background-removal@1.7.0";

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");
const processButton = document.getElementById("processButton");
const downloadButton = document.getElementById("downloadButton");
const status = document.getElementById("status");

let selectedFile = null;
let resultUrl = null;

imageInput.addEventListener("change", () => {

  const file = imageInput.files[0];

  if (!file) return;

  selectedFile = file;

  previewImage.src = URL.createObjectURL(file);
  preview.style.display = "block";
  processButton.style.display = "block";
  downloadButton.style.display = "none";

  status.className = "status";
  status.textContent = "foto siap diproses.";

});

processButton.addEventListener("click", async () => {

  if (!selectedFile) return;

  processButton.disabled = true;
  processButton.textContent = "MEMPROSES...";

  status.className = "status";
  status.textContent = "sedang memuat ai...";

  try {

    const resultBlob = await removeBackground(selectedFile, {

      model: "isnet_quint8",

      device: "cpu",

      proxyToWorker: false,

      output: {
        format: "image/png",
        type: "foreground"
      },

      progress: (key, current, total) => {

        if (total > 0) {

          const percent = Math.round(
            (current / total) * 100
          );

          status.textContent =
            "sedang memproses... " + percent + "%";

        }

      }

    });

    if (resultUrl) {
      URL.revokeObjectURL(resultUrl);
    }

    resultUrl = URL.createObjectURL(resultBlob);

    previewImage.src = resultUrl;

    downloadButton.href = resultUrl;
    downloadButton.style.display = "block";

    status.className = "status success";
    status.textContent =
      "background berhasil dihapus.";

    processButton.textContent = "SELESAI";

  } catch (error) {

    console.error(error);

    status.className = "status error";
    status.textContent =
      "gagal memproses. coba lagi.";

    processButton.disabled = false;
    processButton.textContent = "COBA LAGI";

  }

});

</script>
