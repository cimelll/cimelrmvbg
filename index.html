<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cimel Remove BG</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, #12345a 0%, transparent 35%),
        #05070a;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px 16px;
    }

    .container {
      width: min(700px, 100%);
      margin: auto;
    }

    header {
      text-align: center;
      margin: 35px 0 45px;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #168cff;
    }

    .subtitle {
      color: #7d8da0;
      margin-top: 10px;
      font-size: 14px;
    }

    .upload-box {
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(15,18,23,.8);
      border-radius: 22px;
      padding: 45px 25px;
      text-align: center;
    }

    .upload-icon {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22,140,255,.1);
      border: 1px solid rgba(22,140,255,.25);
      color: #168cff;
      font-size: 28px;
    }

    h1 {
      margin-top: 22px;
      font-size: 25px;
    }

    .desc {
      margin: 10px auto 25px;
      max-width: 430px;
      color: #78889a;
      font-size: 13px;
      line-height: 1.6;
    }

    .upload-button {
      display: inline-block;
      background: #168cff;
      color: white;
      padding: 14px 25px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .upload-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(22,140,255,.25);
    }

    input {
      display: none;
    }

    .preview {
      display: none;
      margin-top: 22px;
    }

    .preview img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 14px;
      display: block;
      margin: auto;
    }

    .process-button {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #168cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      margin-top: 18px;
      color: #718397;
      font-size: 13px;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #3e4c5b;
      font-size: 11px;
      margin-top: 35px;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">Cimel<span>.</span>Remove BG</div>
      <div class="subtitle">hapus background foto dengan mudah</div>
    </header>

    <main class="upload-box">

      <div class="upload-icon">✦</div>

      <h1>hapus background foto</h1>

      <p class="desc">
        upload gambar kamu dan kita akan memprosesnya
        menjadi gambar dengan background transparan.
      </p>

      <label class="upload-button" for="imageInput">
        pilih foto
      </label>

      <input
        id="imageInput"
        type="file"
        accept="image/png,image/jpeg,image/webp"
      >

      <div class="preview" id="preview">
        <img id="previewImage" alt="preview">
      </div>

      <button class="process-button" id="processButton">
        HAPUS BACKGROUND
      </button>

      <div class="status" id="status"></div>

    </main>

    <footer>
      cimel remove bg
    </footer>

  </div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const previewImage = document.getElementById("previewImage");
    const processButton = document.getElementById("processButton");
    const status = document.getElementById("status");

    imageInput.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) return;

      const imageUrl = URL.createObjectURL(file);

      previewImage.src = imageUrl;
      preview.style.display = "block";
      processButton.style.display = "block";

      status.textContent = "foto siap diproses.";
    });

    processButton.addEventListener("click", function () {
      status.textContent = "fitur penghapus background sedang disiapkan...";
    });
  </script>

</body>
        </html>
